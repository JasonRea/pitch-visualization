[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchviz"
version = "0.1.0"
description = "Pitch visualization API and rendering pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "httpx==0.28.1",
    "cachetools==5.5.2",
    "pydantic",
    "pybaseball==2.2.7",
    "pandas==3.0.1",
    "numpy==2.4.2",
    "scipy==1.17.1",
    "requests==2.32.5",
]

[project.optional-dependencies]
render = [
    "manim==0.20.0",
    "ManimPango==0.6.1",
    "av==16.1.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
